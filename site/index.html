<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Concierge Ibiza — Private Concierge</title>
  <meta name="description" content="Private villas, yacht charter, jet skis, luxury cars, fine dining and VIP nightlife in Ibiza. One dedicated concierge.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script>window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/';</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Widgets/widgets.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#top" aria-label="Concierge Ibiza">Concierge <em>Ibiza</em></a>
    <a class="btn small" href="#concierge">Create your experience</a>
  </header>

  <!-- Capa geográfica (real) -->
  <div id="stage" aria-hidden="true">
    <div id="cesium"></div>
    <div class="vignette"></div>
    <!-- Transición piscina → mar: aquí irá el vídeo real de la villa -->
    <div id="villa-mask"><div class="villa-media"><span>Authentic villa footage · pending</span></div></div>
  </div>
  <div id="credits" aria-label="Map data attribution"></div>
  <p id="status" role="status"></p>

  <!-- Capa comercial -->
  <main id="top">
    <div id="world-track">
      <div class="sticky">
        <div id="panels"></div>
        <ol id="rail" aria-label="Journey"></ol>
      </div>
    </div>
    <div id="world-end"></div>

    <section id="concierge" class="concierge">
      <div class="concierge-inner">
        <p class="eyebrow">Private Concierge</p>
        <h2>YOUR IBIZA EXPERIENCE STARTS HERE.</h2>
        <p class="body">Tell us what you have in mind. One concierge will design and coordinate every detail.</p>
        <form id="concierge-form">
          <fieldset>
            <legend>Services</legend>
            <div id="services" class="chips"></div>
          </fieldset>
          <div class="grid">
            <label>Arrival<input type="date" name="from"></label>
            <label>Departure<input type="date" name="to"></label>
            <label>Guests<input type="number" name="guests" min="1" max="50" inputmode="numeric"></label>
            <label>Name<input type="text" name="name" required autocomplete="name"></label>
          </div>
          <label>Anything we should know?<textarea name="notes" rows="3"></textarea></label>
          <button class="btn" type="submit">CREATE YOUR PRIVATE EXPERIENCE</button>
        </form>
        <p class="direct">Or reach us directly · <a data-wa href="#">WhatsApp</a> · <a data-email href="#"></a></p>
      </div>
    </section>
  </main>

  <a class="wa-float" data-wa href="#" aria-label="Chat on WhatsApp">WhatsApp</a>

  <script src="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Cesium.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/world.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
